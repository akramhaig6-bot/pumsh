# ============================================================
# وكيل Nginx عكسي لمنصة نَما
#
# لا يوجد أي نطاق ثابت في هذا الملف سوى place­holder واحد واضح:
#   your-domain.example
# استبدله في المواضع الثلاثة المحددة بـ EDIT.
#
# التثبيت:
#   sudo cp deployment/nginx.conf /etc/nginx/sites-available/mana
#   sudo ln -s /etc/nginx/sites-available/mana /etc/nginx/sites-enabled/mana
#   sudo nginx -t && sudo systemctl reload nginx
#
# الشهادة (Let's Encrypt):
#   sudo certbot --nginx -d your-domain.example
# ============================================================

# توجيه HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;          # ← EDIT 1

    # تحدي ACME يمرّ قبل التحويل
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.example;          # ← EDIT 2

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;   # ← EDIT 3
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;     # ← EDIT 3

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ----------------------------------------------------------------
    # حجم جسم الطلب
    # يجب أن يطابق MAX_FILE_MB × MAX_FILES_PER_REQUEST في .env.
    # الافتراضي هنا 50MB (8 ملفات × 5MB + هامش).
    # ----------------------------------------------------------------
    client_max_body_size 50m;

    # مهل الرفع — الملفات الكبيرة على اتصال بطيء
    client_body_timeout 120s;
    send_timeout 120s;

    # ضغط النصوص فقط — الصور والملفات مضغوطة أصلاً
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss image/svg+xml;

    # ---------------------------------------------------------------
    # Socket.IO — ترقية WebSocket
    # نفس الأصل ومنفذ الخادم نفسه، فلا حاجة لأي إعداد CORS إضافي.
    # ---------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # اتصالات WebSocket طويلة — لا تُغلق بعد 60 ثانية
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---------------------------------------------------------------
    # واجهة برمجة التطبيقات
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    # ---------------------------------------------------------------
    # نقطة الصحة — للمراقبة، بلا تخزين مؤقت
    # ---------------------------------------------------------------
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # ---------------------------------------------------------------
    # كل ما عدا ذلك → الخادم (يخدم dist/ و SPA fallback)
    # ---------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ============================================================
# بعد ضبط هذا الوكيل، اضبط في .env:
#
#   TRUST_PROXY_HOPS=1
#
# قفزة واحدة فقط (nginx). إن وضعت أكثر من وسيط فزد الرقم بعددها.
# تحذير: قيمة أكبر من عدد القفزات الحقيقية تعيد فتح ثغرة تدوير
# X-Forwarded-For لتجاوز حدود المعدل.
# ============================================================
